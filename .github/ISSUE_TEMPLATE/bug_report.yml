name: Bug report
description: Report a reproducible problem in the website.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Do not include phone numbers, private messages, or other personal information.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
      placeholder: The button does ... but I expected ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Android 15
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or console errors
      description: Add relevant evidence, with personal information removed.
    validations:
      required: false
