    <script>
        const yes = document.querySelector("#yes");
const no = document.querySelector("#no");
const confirmation = document.querySelector(".confirmation");
const container = document.querySelector(".container");
let noIsEscaping = false;
let lastNoMove = 0;
let noAnimationFrame = null;

const yesAnswerMethod = () => {
    container.style.display = 'none';
    confirmation.style.display = 'block';
};

const moveNoButton = (pointerX = null, pointerY = null, snap = false) => {
    no.style.position = 'absolute';

    const containerRect = container.getBoundingClientRect();
    const maxX = Math.max(0, container.clientWidth - no.offsetWidth);
    const maxY = Math.max(0, container.clientHeight - no.offsetHeight);
    let xPosition = 0;
    let yPosition = 0;

    for (let attempt = 0; attempt < 20; attempt += 1) {
        const candidateX = Math.floor(Math.random() * (maxX + 1));
        const candidateY = Math.floor(Math.random() * (maxY + 1));
        const candidateCenterX = containerRect.left + candidateX + no.offsetWidth / 2;
        const candidateCenterY = containerRect.top + candidateY + no.offsetHeight / 2;
        const distanceFromPointer = pointerX === null ? Infinity : Math.hypot(
            candidateCenterX - pointerX,
            candidateCenterY - pointerY
        );

        xPosition = candidateX;
        yPosition = candidateY;

        if (distanceFromPointer > 140) {
            break;
        }
    }

    const startX = Number.parseFloat(no.style.left) || no.offsetLeft || 0;
    const startY = Number.parseFloat(no.style.top) || no.offsetTop || 0;
    const isArched = Math.random() > 0.45;
    const midpointX = (startX + xPosition) / 2;
    const midpointY = (startY + yPosition) / 2;
    const direction = Math.random() > 0.5 ? 1 : -1;
    const curveAmount = isArched ? (70 + Math.random() * 90) * direction : 0;
    const controlX = Math.min(maxX, Math.max(0, midpointX - curveAmount));
    const controlY = Math.min(maxY, Math.max(0, midpointY + curveAmount * 0.55));
    const duration = 650 + Math.random() * 350;
    const startTime = performance.now();

    if (snap) {
        no.style.left = `${xPosition}px`;
        no.style.top = `${yPosition}px`;
        return;
    }

    if (noAnimationFrame !== null) {
        cancelAnimationFrame(noAnimationFrame);
    }

    const animate = (currentTime) => {
        const progress = Math.min(1, (currentTime - startTime) / duration);
        const easedProgress = 1 - Math.pow(1 - progress, 3);
        const inverseProgress = 1 - easedProgress;
        const currentX = inverseProgress * inverseProgress * startX
            + 2 * inverseProgress * easedProgress * controlX
            + easedProgress * easedProgress * xPosition;
        const currentY = inverseProgress * inverseProgress * startY
            + 2 * inverseProgress * easedProgress * controlY
            + easedProgress * easedProgress * yPosition;

        no.style.left = `${currentX}px`;
        no.style.top = `${currentY}px`;

        if (progress < 1) {
            noAnimationFrame = requestAnimationFrame(animate);
        } else {
            noAnimationFrame = null;
        }
    };

    noAnimationFrame = requestAnimationFrame(animate);
};

const noAnswerMethod = (event) => {
    noIsEscaping = true;
    moveNoButton(event.clientX, event.clientY, true);
};

const repelNoButton = (event) => {
    if (!noIsEscaping || Date.now() - lastNoMove < 280) {
        return;
    }

    const noRect = no.getBoundingClientRect();
    const distanceToButton = Math.hypot(
        event.clientX - (noRect.left + noRect.width / 2),
        event.clientY - (noRect.top + noRect.height / 2)
    );

    if (distanceToButton < 150) {
        lastNoMove = Date.now();
        moveNoButton(event.clientX, event.clientY);
    }
};

no.addEventListener('click', noAnswerMethod);
no.addEventListener('pointerenter', (event) => {
    if (noIsEscaping) {
        lastNoMove = Date.now();
        moveNoButton(event.clientX, event.clientY);
    }
});
document.addEventListener('pointermove', repelNoButton);
yes.addEventListener('click', yesAnswerMethod);

document.getElementById("fix").addEventListener("click", function(){
    window.location= "https://wa.me/+918802130983?text=Chalo date pr chalein !!!!! ";
}, false);
    </script>
